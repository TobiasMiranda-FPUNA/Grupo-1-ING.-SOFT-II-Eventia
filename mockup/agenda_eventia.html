<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eventia | Agenda</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px Arial,sans-serif;background:#f4f7fb;color:#17243a}.top{background:#14243b;color:white;padding:20px 28px;font-size:23px;font-weight:bold}.wrap{padding:26px;max-width:1450px;margin:auto}.muted{color:#64748b}.head{display:flex;justify-content:space-between;gap:20px;align-items:center}.head h1{margin:8px 0}.btn,select,input{padding:11px 13px;border:1px solid #cbd5e1;border-radius:7px;background:white;font:inherit}.btn{cursor:pointer;color:#145ec1}.primary{background:#1264d8;color:white;border-color:#1264d8;width:100%;margin-top:12px}.days,.filters{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}.day{flex:1;min-width:130px}.day.active{background:#1264d8;color:white}.filters input{margin-left:auto;min-width:210px}.content{display:grid;grid-template-columns:minmax(580px,1fr) 320px;gap:16px}.table{display:grid;grid-template-columns:70px repeat(4,minmax(120px,1fr));background:white;border:1px solid #dce4ee;overflow:auto}.cell{padding:9px;border-right:1px solid #dce4ee;border-bottom:1px solid #dce4ee;min-height:58px;font-size:13px}.th{text-align:center;background:#eef3fa;font-weight:bold}.time{color:#64748b;padding-top:20px}.event{width:100%;border:0;border-left:5px solid #1971e8;border-radius:5px;background:#e4f0ff;text-align:left;padding:9px;cursor:pointer;color:#17243a}.event b{display:block;margin-bottom:6px}.green{background:#e2f7ec;border-color:#16a765}.orange{background:#fff0d8;border-color:#f59e0b}.pink{background:#fde7ef;border-color:#d63369}.chosen{outline:2px solid #1264d8}.detail{background:white;border:1px solid #dce4ee;border-radius:9px;padding:20px;align-self:start}.detail h2{margin-top:0}.tag{display:inline-block;background:#e5f0ff;color:#145ec1;padding:6px 10px;border-radius:20px;font-size:12px}.line{margin:13px 0}.desc{line-height:1.55;color:#475569}.notice{display:none;background:#fff3d7;padding:12px;border-radius:7px}.notice.show{display:block}@media(max-width:950px){.content{grid-template-columns:1fr}.head{display:block}.filters input{margin-left:0}}@media(max-width:600px){.wrap{padding:14px}.top{padding:17px}}
</style></head><body><header class="top">▦ EVENTIA</header><main class="wrap">
<div class="head"><div><div class="muted">← Volver a eventos</div><h1>Congreso de Innovación Tecnológica 2026</h1><div class="muted">10–12 de junio de 2026 · Centro de Convenciones – Asunción</div></div><button class="btn" onclick="print()">⇩ Descargar agenda</button></div>
<p id="notice" class="notice">Modo organizador: prototipo de consulta. La edición y guardado real requieren conexión con el backend.</p>
<div class="days" id="days"><button class="btn day active" data-day="0">Martes 10 de junio</button><button class="btn day" data-day="1">Miércoles 11 de junio</button><button class="btn day" data-day="2">Jueves 12 de junio</button></div>
<div class="filters"><label> Sala <select id="room"><option value="all">Todas</option><option>Sala A</option><option>Sala B</option><option>Sala C</option><option>Sala D</option></select></label><label> Tipo <select id="kind"><option value="all">Todos</option><option>Conferencia</option><option>Taller</option><option>Panel</option><option>Networking</option></select></label><input id="search" placeholder="Buscar actividad..."></div>
<div class="content"><div><div class="table" id="grid"></div><p id="empty" class="muted" hidden>No hay actividades para esos filtros.</p></div><section class="detail" id="detail"></section></div>
</main><script>
const rooms=['Sala A','Sala B','Sala C','Sala D'],days=['Martes 10 de junio','Miércoles 11 de junio','Jueves 12 de junio'];
const data=[
[0,8,9,0,'Apertura del evento','Conferencia','blue','Comité organizador','Bienvenida e introducción al congreso.'],
[0,9,10,0,'El futuro de la IA','Conferencia','blue','Dra. Laura Méndez','Tendencias actuales y futuras de la inteligencia artificial y su impacto.'],
[0,9,11,1,'Taller: Introducción a Machine Learning','Taller','green','Ing. Carlos Benítez','Introducción práctica al aprendizaje automático.'],
[0,10,11,2,'Panel: Innovación en Latinoamérica','Panel','orange','Panel de invitados','Experiencias de innovación y transformación digital regional.'],
[0,11,12,0,'Tecnología y sociedad','Conferencia','blue','Prof. Ana Rojas','Impacto social de la tecnología.'],
[0,11,12,3,'Espacio de networking','Networking','pink','Comunidad Eventia','Encuentro entre participantes.'],
[0,14,15,0,'Ciberseguridad en la nube','Conferencia','blue','Lic. Diego Vera','Buenas prácticas de protección de servicios y datos.'],
[0,14,16,1,'Taller: Desarrollo con Angular','Taller','green','Equipo frontend','Construcción de interfaces con Angular.'],
[0,15,16,2,'Panel: Mujeres en tecnología','Panel','orange','Panel de invitadas','Trayectorias y oportunidades en tecnología.'],
[0,16,17,0,'Cierre del día','Conferencia','blue','Comité organizador','Resumen de la jornada.'],
[1,9,10,0,'Transformación digital','Conferencia','blue','María Duarte','Estrategias de transformación digital.'],
[1,10,12,1,'Taller de APIs','Taller','green','Equipo backend','Diseño y consumo de APIs.'],
[1,13,14,2,'Panel de emprendimiento','Panel','orange','Emprendedores invitados','Experiencias de emprendimientos tecnológicos.'],
[2,9,10,3,'Networking y comunidad','Networking','pink','Comunidad Eventia','Encuentro abierto de asistentes.'],
[2,10,12,0,'Seguridad por diseño','Conferencia','blue','Especialistas invitados','Principios de seguridad desde el diseño.'],
[2,14,16,1,'Laboratorio de datos','Taller','green','Equipo de datos','Ejercicios de análisis de datos.']];
let day=0,chosen=data[1],saved=false;
function detail(){let s=chosen;document.getElementById('detail').innerHTML=`<h2>${s[4]}</h2><span class="tag">${s[5]}</span><p class="line">▣ ${days[s[0]]} de 2026</p><p class="line">◷ ${String(s[1]).padStart(2,'0')}:00–${String(s[2]).padStart(2,'0')}:00</p><p class="line">⌖ ${rooms[s[3]]} – Centro de Convenciones</p><p class="desc">${s[8]}</p><hr><b>Expositor</b><p>${s[7]}</p><span class="tag">Tecnología</span><button class="btn primary" id="save">${saved?'✓ Agregada a mi agenda':'＋ Agregar a mi agenda'}</button>`;document.getElementById('save').onclick=()=>{saved=!saved;detail()}}
function render(){let room=document.getElementById('room').value,kind=document.getElementById('kind').value,q=document.getElementById('search').value.toLowerCase();let list=data.filter(s=>s[0]===day&&(room==='all'||rooms[s[3]]===room)&&(kind==='all'||s[5]===kind)&&s[4].toLowerCase().includes(q));let g=document.getElementById('grid');g.innerHTML='';['Hora',...rooms].forEach((x,i)=>{let e=document.createElement('div');e.className='cell th';e.textContent=x;g.append(e)});for(let h=8;h<=17;h++){let t=document.createElement('div');t.className='cell time';t.textContent=String(h).padStart(2,'0')+':00';g.append(t);for(let r=0;r<4;r++){let c=document.createElement('div');c.className='cell';let s=list.find(x=>x[3]===r&&x[1]===h);if(s){let b=document.createElement('button');b.className='event '+s[6]+(s===chosen?' chosen':'');b.innerHTML=`<b>${s[4]}</b>${String(s[1]).padStart(2,'0')}:00–${String(s[2]).padStart(2,'0')}:00`;b.onclick=()=>{chosen=s;saved=false;detail();render()};c.append(b)}g.append(c)}}document.getElementById('empty').hidden=!!list.length}
document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{day=+b.dataset.day;document.querySelectorAll('.day').forEach(x=>x.classList.toggle('active',x===b));chosen=data.find(s=>s[0]===day)||data[0];saved=false;detail();render()});
['room','kind','search'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',render));
if(['organizador','admin'].includes(new URLSearchParams(location.search).get('rol')))document.getElementById('notice').classList.add('show');
detail();render();
</script></body></html>
