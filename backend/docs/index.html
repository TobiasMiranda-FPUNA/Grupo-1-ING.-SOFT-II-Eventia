<!doctype html>
<!--
  Documentación interactiva (Swagger UI) de la API de Eventia.
  Se sirve desde el backend en http://localhost:8000/api-docs/ y carga el
  esquema openapi.json de esta misma carpeta (generado con
  docs/generate_openapi.py). Ver docs/README.md.
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eventia API - Swagger</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
  <style>
    body { margin: 0; background: #fafafa; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>

  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: "./openapi.json",
      dom_id: "#swagger-ui",
      deepLinking: true,
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
      layout: "StandaloneLayout",
      // Conserva el token de "Authorize" al recargar la página.
      persistAuthorization: true,
      // Muestra cuánto tardó cada petición ejecutada con "Try it out".
      displayRequestDuration: true,
      filter: true,
      docExpansion: "list",
      tryItOutEnabled: true
    });
  </script>
</body>
</html>
