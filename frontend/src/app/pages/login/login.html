<div class="login-container">
    <div class="login-card">
        <div class="login-header">
        <h2>Iniciar Sesión</h2>
        <p>Sistema de Gestión de Eventos</p>
        </div>

        <!-- Mensaje de error general de la API (Criterio de Aceptación) -->
        <div class="alert alert-danger" *ngIf="errorMessage">
        {{ errorMessage }}
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <!-- Campo Correo -->
        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="ejemplo@correo.com"
            [class.is-invalid]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
            />
            <div class="error-feedback" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
            <small *ngIf="loginForm.get('email')?.errors?.['required']">El correo es obligatorio.</small>
            <small *ngIf="loginForm.get('email')?.errors?.['email']">Ingrese un correo electrónico válido.</small>
            </div>
        </div>

        <!-- Campo Contraseña -->
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input
            type="password"
            id="password"
            formControlName="password"
            placeholder="••••••••"
            [class.is-invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
            />
            <div class="error-feedback" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
            <small *ngIf="loginForm.get('password')?.errors?.['required']">La contraseña es obligatoria.</small>
            <small *ngIf="loginForm.get('password')?.errors?.['minlength']">Mínimo 6 caracteres.</small>
            </div>
        </div>

        <!-- Botón de Envío -->
        <button type="submit" [disabled]="loginForm.invalid || isLoading" class="btn-primary">
            <span *ngIf="!isLoading">Ingresar</span>
            <span *ngIf="isLoading">Cargando...</span>
        </button>
        </form>
    </div>
</div>
